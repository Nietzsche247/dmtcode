<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180" role="img"><title>Aquincum kA-type sign</title><desc>Two upraised arms on a base, a closed hieroglyphic form without terminal rings. Drawn to show why it is a boundary case, not a ring-letter.</desc><path d="M 60 140 L 160 140" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 60 140 L 60 62 L 74 50" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 160 140 L 160 62 L 146 50" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>