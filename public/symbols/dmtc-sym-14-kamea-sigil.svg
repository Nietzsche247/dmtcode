<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img"><title>Agrippa's kamea sigil procedure</title><desc>Saturn's three-by-three square with a demonstration path from 8 through 5 to 2. A circle marks the first letter, a bar the last. Procedure documented 1533.</desc><rect x="25" y="25" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="60" y="69" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">4</text><rect x="95" y="25" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="130" y="69" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">9</text><rect x="165" y="25" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="200" y="69" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">2</text><rect x="25" y="95" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="60" y="139" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">3</text><rect x="95" y="95" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="130" y="139" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">5</text><rect x="165" y="95" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="200" y="139" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">7</text><rect x="25" y="165" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="60" y="209" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">8</text><rect x="95" y="165" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"/><text x="130" y="209" font-family="Georgia, serif" font-size="26" fill="#1f1b16" text-anchor="middle">1</text><rect x="165" y="165" width="70" height="70" fill="none" stroke="#1f1b16" stroke-width="3"