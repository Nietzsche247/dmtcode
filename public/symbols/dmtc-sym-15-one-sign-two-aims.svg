<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 205" width="480" height="205" role="img"><title>One sign, opposite aims</title><desc>The same eta-form ring-letter as it recurs in love and curse contexts. Intent lives in the recipe rubric, not in the glyph.</desc><path d="M 96 44 L 96 150" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 144 44 L 144 150" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 96 97 L 144 97" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="96" cy="44" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="144" cy="44" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="96" cy="150" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="144" cy="150" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><text x="120" y="186" font-family="Georgia, serif" font-size="15" fill="#6b6257" text-anchor="middle">in a love recipe</text><path d="M 336 44 L 336 150" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 384 44 L 384 150" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 336 97 L 384 97" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="44" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="384" cy="44" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="336" cy="150" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="384" cy="150" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><text x="360" y="186" font-family="Georgia, serif" font-size="15" fill="#6b6257" text-anchor="middle">in a curse tablet</text></svg>