<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img"><title>Hebrew letters glossed above charakteres</title><desc>The Genizah glossing device: Hebrew letters written above signs so a name could be spelled in signs. The device is attested; this particular pairing is illustrative.</desc><path d="M 64 168 L 90 70 L 116 168" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 74 132 L 106 132" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="70" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="64" cy="168" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="116" cy="168" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><path d="M 266 76 L 214 76 L 214 168 L 266 168" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="266" cy="76" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="266" cy="168" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><path d="M 372 76 L 372 168" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 372 76 L 414 76" fill="none" stroke="#1f1b16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="414" cy="76" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><circle cx="372" cy="168" r="9" fill="none" stroke="#1f1b16" stroke-width="5"/><text x="390" y="52" font-family="'SBL Hebrew', 'Times New Roman', Georgia, serif" font-size="36" fill="#1f1b16" text-anchor="middle">&#1488;</text><text x="240" y="52" font-family="'SBL Hebrew', 'Times New Roman', Georgia, serif" font-size="36" fill="#1f1b16" text-anchor="middle">&#1489;</text><text x="90" y="52" font-family="'SBL Hebrew', 'Times New Roman', Georgia, serif" font-size="36" fill="#1f1b16" text-anchor="middle">&#1490;</text></svg>