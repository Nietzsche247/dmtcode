[build]
  publish = "dist"

# Bot logger runs FIRST so every crawler hit is captured before other logic.
[[edge_functions]]
  path = "/*"
  function = "bot-logger"

# Edge functions run BEFORE the SPA fallback so crawlers and agents get real data.
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/data.json"
  function = "data-json"

[[edge_functions]]
  path = "/shop.json"
  function = "shop-json"

[[edge_functions]]
  path = "/"
  function = "content-prerender"

[[edge_functions]]
  path = "/registry"
  function = "content-prerender"

[[edge_functions]]
  path = "/registry/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/trials"
  function = "content-prerender"

[[edge_functions]]
  path = "/trials/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/bibliography"
  function = "content-prerender"

[[edge_functions]]
  path = "/dataset"
  function = "content-prerender"

[[edge_functions]]
  path = "/about"
  function = "content-prerender"

[[edge_functions]]
  path = "/critiques"
  function = "content-prerender"

[[edge_functions]]
  path = "/null-reports"
  function = "content-prerender"

[[edge_functions]]
  path = "/glossary"
  function = "content-prerender"

[[edge_functions]]
  path = "/methods"
  function = "content-prerender"

[[edge_functions]]
  path = "/open-questions"
  function = "content-prerender"

[[edge_functions]]
  path = "/research"
  function = "content-prerender"

[[edge_functions]]
  path = "/protocols"
  function = "content-prerender"

[[edge_functions]]
  path = "/protocols/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/forecasts"
  function = "content-prerender"

[[edge_functions]]
  path = "/protocol-guide"
  function = "content-prerender"

[[edge_functions]]
  path = "/prepare"
  function = "content-prerender"

[[edge_functions]]
  path = "/evidence-map"
  function = "content-prerender"

[[edge_functions]]
  path = "/timeline"
  function = "content-prerender"

[[edge_functions]]
  path = "/timeline/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/faq"
  function = "content-prerender"

[[edge_functions]]
  path = "/people"
  function = "content-prerender"

[[edge_functions]]
  path = "/people/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/bibliography/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/theories"
  function = "content-prerender"

[[edge_functions]]
  path = "/theories/*"
  function = "content-prerender"


[[edge_functions]]
  path = "/events"
  function = "content-prerender"

[[edge_functions]]
  path = "/events/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/retreats"
  function = "content-prerender"

[[edge_functions]]
  path = "/retreats/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/privacy"
  function = "content-prerender"

[[edge_functions]]
  path = "/terms"
  function = "content-prerender"

[[edge_functions]]
  path = "/disclosure"
  function = "content-prerender"

[[edge_functions]]
  path = "/shipping"
  function = "content-prerender"

[[edge_functions]]
  path = "/returns"
  function = "content-prerender"

[[edge_functions]]
  path = "/store-terms"
  function = "content-prerender"

[[edge_functions]]
  path = "/store-contact"
  function = "content-prerender"

[[edge_functions]]
  path = "/card/*"
  function = "convergence-card"

# Articles machine endpoints MUST be mapped ABOVE the content-prerender /articles/*
# entry below, otherwise the prerender will swallow them.
[[edge_functions]]
  path = "/articles.json"
  function = "articles-json"

[[edge_functions]]
  path = "/articles/feed.xml"
  function = "articles-feed"

[[edge_functions]]
  path = "/articles"
  function = "content-prerender"

[[edge_functions]]
  path = "/articles/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/guides"
  function = "content-prerender"

[[edge_functions]]
  path = "/guides/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/capture"
  function = "content-prerender"

[[edge_functions]]
  path = "/co-witnesses"
  function = "content-prerender"

[[edge_functions]]
  path = "/join"
  function = "content-prerender"

[[edge_functions]]
  path = "/submit-symbol"
  function = "content-prerender"


[[edge_functions]]
  path = "/sitemap-es.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/sitemap-de.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/sitemap-index.xml"
  function = "sitemap"

# Locale mirrors: /es/* and /de/* prerender the same routes as English. These
# run AFTER the machine endpoints (which are English-only) and BEFORE spa-guard.
[[edge_functions]]
  path = "/es/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/de/*"
  function = "content-prerender"

# 404 guard MUST run last: it whitelists known routes and 404s the rest.
[[edge_functions]]
  path = "/*"
  function = "spa-guard"

[[redirects]]
  from = "/danny-goler"
  to = "/people/danny-goler"
  status = 301
  force = true

# Permanent redirect: /tools ranking equity moves to /prepare.
[[redirects]]
  from = "/tools"
  to = "/prepare"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/prepare"
  status = 301
  force = true



# SPA fallback for every other route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
