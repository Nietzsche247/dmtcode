[build]
  publish = "dist"

# Bot logger runs FIRST so every crawler hit is captured before other logic.
[[edge_functions]]
  path = "/*"
  function = "bot-logger"

# Edge functions run BEFORE the SPA fallback so crawlers and agents get real data.
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/data.json"
  function = "data-json"

[[edge_functions]]
  path = "/shop.json"
  function = "shop-json"

[[edge_functions]]
  path = "/"
  function = "content-prerender"

[[edge_functions]]
  path = "/registry"
  function = "content-prerender"

[[edge_functions]]
  path = "/registry/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/trials"
  function = "content-prerender"

[[edge_functions]]
  path = "/trials/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/bibliography"
  function = "content-prerender"

[[edge_functions]]
  path = "/dataset"
  function = "content-prerender"

[[edge_functions]]
  path = "/about"
  function = "content-prerender"

[[edge_functions]]
  path = "/critiques"
  function = "content-prerender"

[[edge_functions]]
  path = "/the-discovery"
  function = "content-prerender"

[[edge_functions]]
  path = "/null-reports"
  function = "content-prerender"

[[edge_functions]]
  path = "/glossary"
  function = "content-prerender"

[[edge_functions]]
  path = "/methods"
  function = "content-prerender"

[[edge_functions]]
  path = "/open-questions"
  function = "content-prerender"

[[edge_functions]]
  path = "/object-model"
  function = "content-prerender"

[[edge_functions]]
  path = "/research"
  function = "content-prerender"

[[edge_functions]]
  path = "/protocols"
  function = "content-prerender"

[[edge_functions]]
  path = "/protocols/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/forecasts"
  function = "content-prerender"

[[edge_functions]]
  path = "/protocol-guide"
  function = "content-prerender"

[[edge_functions]]
  path = "/prepare"
  function = "content-prerender"

# The document index. It is served at /documents, not at /downloads, because
# public/downloads is a real directory in the publish output and Netlify does
# not route a path that collides with a static directory to an edge function:
# the bare path returned the raw SPA shell at 200 no matter what was registered
# here. /downloads is redirected to it below. The PDF files themselves stay
# where they are and keep their published URLs.
[[edge_functions]]
  path = "/documents"
  function = "content-prerender"

[[edge_functions]]
  path = "/evidence-map"
  function = "content-prerender"

[[edge_functions]]
  path = "/timeline"
  function = "content-prerender"

[[edge_functions]]
  path = "/timeline/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/faq"
  function = "content-prerender"

[[edge_functions]]
  path = "/people"
  function = "content-prerender"

[[edge_functions]]
  path = "/people/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/products/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/bibliography/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/theories"
  function = "content-prerender"

[[edge_functions]]
  path = "/theories/*"
  function = "content-prerender"


[[edge_functions]]
  path = "/events"
  function = "content-prerender"

[[edge_functions]]
  path = "/events/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/retreats"
  function = "content-prerender"

[[edge_functions]]
  path = "/retreats/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/privacy"
  function = "content-prerender"

[[edge_functions]]
  path = "/terms"
  function = "content-prerender"

[[edge_functions]]
  path = "/disclosure"
  function = "content-prerender"

[[edge_functions]]
  path = "/shipping"
  function = "content-prerender"

[[edge_functions]]
  path = "/returns"
  function = "content-prerender"

[[edge_functions]]
  path = "/store-terms"
  function = "content-prerender"

[[edge_functions]]
  path = "/store-contact"
  function = "content-prerender"

[[edge_functions]]
  path = "/card/*"
  function = "convergence-card"

# Articles machine endpoints MUST be mapped ABOVE the content-prerender /articles/*
# entry below, otherwise the prerender will swallow them.
[[edge_functions]]
  path = "/articles.json"
  function = "articles-json"

[[edge_functions]]
  path = "/articles/feed.xml"
  function = "articles-feed"

[[edge_functions]]
  path = "/articles"
  function = "content-prerender"

[[edge_functions]]
  path = "/articles/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/guides"
  function = "content-prerender"

[[edge_functions]]
  path = "/guides/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/capture"
  function = "content-prerender"

[[edge_functions]]
  path = "/co-witnesses"
  function = "content-prerender"

[[edge_functions]]
  path = "/join"
  function = "content-prerender"

[[edge_functions]]
  path = "/preregister"
  function = "content-prerender"

[[edge_functions]]
  path = "/submit-symbol"
  function = "content-prerender"


[[edge_functions]]
  path = "/sitemap-es.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/sitemap-de.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/sitemap-index.xml"
  function = "sitemap"

# Locale mirrors: /es/* and /de/* prerender the same routes as English. These
# run AFTER the machine endpoints (which are English-only) and BEFORE spa-guard.
[[edge_functions]]
  path = "/es/*"
  function = "content-prerender"

[[edge_functions]]
  path = "/de/*"
  function = "content-prerender"

# 404 guard MUST run last: it whitelists known routes and 404s the rest.
[[edge_functions]]
  path = "/*"
  function = "spa-guard"

# CDN caching for HTML responses. Crawlers and AI agents otherwise trigger an
# origin render on every visit to every sitemap URL. The browser-facing
# cache-control stays untouched (public/_headers and the edge functions own
# it); this only tells the Netlify CDN it may hold a copy for an hour and serve
# stale for a day. Prerendered responses set the same value in
# content-prerender.ts; this rule covers the static shell and public assets.
[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400, durable"

# Authenticated and account routes are never CDN-cached. These specific rules
# shadow the wildcard above for the same header name.
[[headers]]
  for = "/admin"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/auth"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/profile"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/dashboard"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/my-symbols"
  [headers.values]
    Netlify-CDN-Cache-Control = "no-store"
    X-Robots-Tag = "noindex, follow"

# Personal and signup routes render client side only. Tell crawlers so at the
# edge rather than leaving them an empty shell to index.
[[headers]]
  for = "/log"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/waitlist"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[redirects]]
  from = "/danny-goler"
  to = "/people/danny-goler"
  status = 301
  force = true

# Permanent redirect: /tools ranking equity moves to /prepare.
[[redirects]]
  from = "/tools"
  to = "/prepare"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/prepare"
  status = 301
  force = true

# /downloads is the path people and machines guess, and llms.txt has pointed at
# that directory for months, but it cannot host the index page: it collides with
# the public/downloads directory, so Netlify serves the static directory and the
# edge function never runs. The exact path redirects to the page. The wildcard is
# deliberately absent so every published PDF URL under /downloads/ keeps working.
[[redirects]]
  from = "/downloads"
  to = "/documents"
  status = 301
  force = true



# SPA fallback for every other route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
